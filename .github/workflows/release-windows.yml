name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build desktop application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $projectVersion = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $projectVersion) { throw "A tag $version precisa corresponder à versão $projectVersion do arquivo VERSION." }
          ./src/BountyStudio.Desktop/build.ps1 -Version $version -GitHubRepository $env:GITHUB_REPOSITORY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/BountyStudio.exe --title "Bounty Studio $tag" --generate-notes
