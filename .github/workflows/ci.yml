name: CI - Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    # Run on all PRs including dependabot branches
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.3.0
        with:
          python-version: '3.11'

      - name: Read VERSION file
        id: version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run Python Unit Tests
        run: python -m unittest tests/test_bounty.py

      - name: Run PowerShell Test Suite
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test Desktop Application Compilation
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.version.outputs.version }} -GitHubRepository ${{ github.repository }}

  # Separate job for codeql to not block main tests
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b549b9259bda1b519b7304a4e11c638f9f2b63a # v3.28.0
        with:
          languages: csharp, python, powershell
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b549b9259bda1b519b7304a4e11c638f9f2b63a # v3.28.0
        with:
          category: "/language:csharp"
